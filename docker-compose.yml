services:
  db:
    image: postgres:16-alpine
    container_name: qhse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qhse
      POSTGRES_PASSWORD: qhse_dev_password
      POSTGRES_DB: qhse
    ports: ["5432:5432"]
    volumes: ["qhse_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qhse -d qhse"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./apps/api
    container_name: qhse-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qhse:qhse_dev_password@db:5432/qhse?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 15m
      REFRESH_SECRET: change-me-refresh-in-production
      PORT: 3000
      UPLOAD_DIR: /app/uploads
    ports: ["3000:3000"]
    volumes:
      - qhse_uploads:/app/uploads
      - ./import:/app/import:ro
volumes:
  qhse_pgdata:
  qhse_uploads:
