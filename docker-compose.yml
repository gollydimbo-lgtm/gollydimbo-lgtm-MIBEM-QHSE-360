services:
  db:
    image: postgres:16-alpine
    container_name: qhse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qhse
      POSTGRES_PASSWORD: EDKAQMkn4okBDpcZZTiS76xStEXc5NC-
      POSTGRES_DB: qhse
    ports: ["5432:5432"]
    volumes: ["qhse_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qhse -d qhse"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./apps/api
    container_name: qhse-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qhse:EDKAQMkn4okBDpcZZTiS76xStEXc5NC-@db:5432/qhse?schema=public
      JWT_SECRET: d5cce86eee4082d32d2ee5be9995f3600c7a424737f281ab1814d54a4a0c0472
      JWT_EXPIRES_IN: 15m
      REFRESH_SECRET: a53ef949757f3fa5d6c7c92eb964ee7723d47449f94152bd511946913e2b820b
      PORT: 3000
      UPLOAD_DIR: /app/uploads
    ports: ["3000:3000"]
    volumes:
      - qhse_uploads:/app/uploads
      - ./import:/app/import:ro
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: qhse-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: qhse
      POSTGRES_USER: qhse
      POSTGRES_PASSWORD: EDKAQMkn4okBDpcZZTiS76xStEXc5NC-
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
volumes:
  qhse_pgdata:
  qhse_uploads:
