name: Build Windows

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL de l'API QHSE (ex: https://qhse.mibem.com/api/v4)"
        required: false
        default: ''

jobs:
  build-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Générer le socle natif Windows si absent
        shell: bash
        run: bash .github/scripts/ensure-flutter-platforms.sh

      - name: Récupérer les dépendances
        working-directory: apps/flutter
        run: flutter pub get

      - name: Build Windows release
        working-directory: apps/flutter
        shell: bash
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.QHSE_API_BASE_URL || '' }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build windows --release --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            flutter build windows --release
          fi

      - name: Compresser le build Windows
        shell: pwsh
        run: |
          Compress-Archive -Path "apps/flutter/build/windows/x64/runner/Release/*" -DestinationPath "qhse-mobile-windows.zip"

      - name: Upload artefact Windows
        uses: actions/upload-artifact@v4
        with:
          name: qhse-mobile-windows
          path: qhse-mobile-windows.zip
          retention-days: 30

      - name: Publier / mettre à jour la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "QHSE MIBEM Mobile — build ${{ github.run_number }}"
          body: "Build automatique. Windows joint ici, aux côtés de l'APK Android déjà publié."
          files: qhse-mobile-windows.zip
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
