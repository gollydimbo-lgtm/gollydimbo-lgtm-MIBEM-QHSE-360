name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/flutter/**'
      - '.github/workflows/build-apk.yml'
      - '.github/scripts/ensure-flutter-platforms.sh'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL de l'API QHSE (ex: https://qhse.mibem.com/api/v4)"
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Générer le socle natif Android si absent
        run: bash .github/scripts/ensure-flutter-platforms.sh

      - name: Récupérer les dépendances
        working-directory: apps/flutter
        run: flutter pub get

      - name: Analyse statique (non bloquante)
        working-directory: apps/flutter
        run: flutter analyze || true

      - name: Build APK release
        working-directory: apps/flutter
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.QHSE_API_BASE_URL || '' }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            flutter build apk --release
          fi

      - name: Upload artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: qhse-mobile-android
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publier / mettre à jour la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: "QHSE MIBEM Mobile — build ${{ github.run_number }}"
          body: "Build automatique depuis ${{ github.sha }}. Android joint ici ; Windows suit dans le même run."
          files: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
